# BloomBoard config
# Cami Webb (cwebb16@bu.edu)

# Add a new buoy by adding a new key under buoys
# Add a new covariate for a buoy by adding a new key under that buoy's covariates
# historical_url is a pre-generated static CSV path (validated/calibrated)
# realtime_url is a NetCDF file path converted to CSV on request by the data portal

s3:
  bucket: "bu4cast-ci"
  base_url: "uri.osn.mghpcc.org"
  read_path: "read/bloomboard"
  write_path: "write/bloomboard"

# how many days ahead to forecast
max_horizon: 7

# "daily" runs for today and appends today's readings to the training data
run_mode: "daily"

# to run a historical backtest instead, comment out run_mode "daily" above
# uncomment the lines below, and fill in the dates you want
#run_mode: "date_range"
#date_range:
#  start: "2021-01-01"
#  end: "2024-12-31"

buoys:
  a01:
    name: "A01"
    lat: 43.022942490079
    lon: -70.5475341233827
    chlorophyll:
      sensor: "optics_s"
      variable: "chlorophyll[micrograms/liter](3m)"
      historical_url: "archive/A01/csv/A01_optics_s_historical.csv"
      realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.optics_s.std_flntus.realtime.nc"
      use_realtime: true
      # Use instead of historical_url/realtime_url above whenever run_mode is "date_range" (backtests). Daily mode always uses the 
      # live feed since calibrated data won't exist yet for today
      calibrated_url: "a01_calibrated_chlorophyll.csv"
    covariates:
      temp_1m:
        sensor: "sbe37"
        variable: "temperature[C](1m)"
        historical_url: "archive/A01/csv/A01_sbe37_historical_1m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.sbe37.realtime.1m.nc"
        use_realtime: true
      sal_1m:
        sensor: "sbe37"
        variable: "salinity[psu](1m)"
        historical_url: "archive/A01/csv/A01_sbe37_historical_1m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.sbe37.realtime.1m.nc"
        use_realtime: true
      cond_1m:
        sensor: "sbe37"
        variable: "conductivity[msiemens/cm](1m)"
        historical_url: "archive/A01/csv/A01_sbe37_historical_1m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.sbe37.realtime.1m.nc"
        use_realtime: true
      temp_20m:
        sensor: "sbe37"
        variable: "temperature[C](20m)"
        historical_url: "archive/A01/csv/A01_sbe37_historical_20m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.sbe37.realtime.20m.nc"
        use_realtime: true
      sal_20m:
        sensor: "sbe37"
        variable: "salinity[psu](20m)"
        historical_url: "archive/A01/csv/A01_sbe37_historical_20m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.sbe37.realtime.20m.nc"
        use_realtime: true
      cond_20m:
        sensor: "sbe37"
        variable: "conductivity[msiemens/cm](20m)"
        historical_url: "archive/A01/csv/A01_sbe37_historical_20m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.sbe37.realtime.20m.nc"
        use_realtime: true
      temp_51m:
        sensor: "optode"
        variable: "temperature[C](51m)"
        historical_url: "archive/A01/csv/A01_optode_historical_51m.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.optode.realtime.51m.nc"
        use_realtime: true
      air_temp:
        sensor: "met"
        variable: "air_temperature[C](-3m)"
        historical_url: "archive/A01/csv/A01_met_historical.csv"
        realtime_url: "/data/gomoos/buoy/archive/A0150/realtime/A0150.met.realtime.nc"
        use_realtime: true
    # which covariates above to actually use in the models
    covariate_combo: ["temp_1m", "cond_1m", "temp_20m", "sal_20m", "cond_20m", "air_temp"]
