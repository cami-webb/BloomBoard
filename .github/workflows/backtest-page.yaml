name: BloomBoard Backtest Page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}

    container: eco4cast/rocker-neon4cast:latest

    steps:
      - run: git config --system --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # eco4cast/rocker-neon4cast doesn't ship curl/jq, which the
      # quarto-actions/setup download script needs
      - name: Install system deps for quarto setup
        run: apt-get update && apt-get install -y --no-install-recommends curl jq

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: |
          Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org"))'
          Rscript -e 'pkgs <- c("yaml","httr","readr","dplyr","lubridate","aws.s3","ggplot2","plotly","htmltools","purrr","tidyr","knitr","patchwork","ranger"); need <- pkgs[!pkgs %in% rownames(installed.packages())]; if(length(need)) install.packages(need, Ncpus = 2)'

      - name: Render backtest page
        run: quarto render dashboard/backtest.qmd --execute-dir "$GITHUB_WORKSPACE"

      # Publishes into an isolated worktree, not the main checkout's working
      # directory -- `git checkout --orphan` on the latter keeps the entire
      # index from the just-checked-out main branch (it doesn't clear the
      # working tree), so a prior version of this step committed the whole
      # repo onto gh-pages by accident. Also scrubs anything that isn't one
      # of the known published files on every run, so it self-heals that
      # branch rather than trusting it stays clean; index/documentation/
      # acknowledgements.html (published separately by dashboard.yaml) are
      # explicitly kept.
      - name: Publish to gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          cp dashboard/_site/backtest.html /tmp/backtest.html
          git fetch origin gh-pages || true
          rm -rf /tmp/gh-pages-wt
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages-wt gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages-wt
          fi
          cd /tmp/gh-pages-wt
          find . -maxdepth 1 -type f ! -name '.git' ! -name 'index.html' ! -name 'documentation.html' ! -name 'acknowledgements.html' ! -name 'backtest.html' -delete
          find . -mindepth 1 -maxdepth 1 -type d ! -name '.git' -exec rm -rf {} +
          cp /tmp/backtest.html .
          git add -A
          git commit -m "update backtest page" || echo "nothing to commit"
          git push origin gh-pages
