name: BloomBoard Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}

    container: eco4cast/rocker-neon4cast:latest

    steps:
      - run: git config --system --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # eco4cast/rocker-neon4cast doesn't ship curl/jq, which the
      # quarto-actions/setup download script needs
      - name: Install system deps for quarto setup
        run: apt-get update && apt-get install -y --no-install-recommends curl jq

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R packages
        run: |
          Rscript -e 'options(repos=c(CRAN="https://cloud.r-project.org"))'
          Rscript -e 'pkgs <- c("yaml","httr","readr","dplyr","lubridate","aws.s3","ggplot2","plotly","htmltools","purrr","ranger"); need <- pkgs[!pkgs %in% rownames(installed.packages())]; if(length(need)) install.packages(need, Ncpus = 2)'

      # Only the pages that actually change day to day -- backtest.qmd
      # pulls ~1500 historical S3 files and never changes with the daily
      # forecast, so it's rendered separately (see backtest-page.yaml),
      # not on this schedule
      - name: Render dashboard pages
        run: |
          quarto render dashboard/index.qmd
          quarto render dashboard/documentation.qmd
          quarto render dashboard/acknowledgements.qmd

      # Publishes into an isolated worktree, not the main checkout's working
      # directory -- `git checkout --orphan` on the latter keeps the entire
      # index from the just-checked-out main branch (it doesn't clear the
      # working tree), so a prior version of this step committed the whole
      # repo onto gh-pages by accident. Also scrubs anything that isn't one
      # of the known published files on every run, so it self-heals that
      # branch rather than trusting it stays clean; backtest.html (published
      # separately by backtest-page.yaml) is explicitly kept.
      - name: Publish to gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          mkdir -p /tmp/pages
          cp dashboard/_site/index.html dashboard/_site/documentation.html dashboard/_site/acknowledgements.html /tmp/pages/
          git fetch origin gh-pages || true
          rm -rf /tmp/gh-pages-wt
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/gh-pages-wt gh-pages
          else
            git worktree add --orphan -b gh-pages /tmp/gh-pages-wt
          fi
          cd /tmp/gh-pages-wt
          find . -maxdepth 1 -type f ! -name 'index.html' ! -name 'documentation.html' ! -name 'acknowledgements.html' ! -name 'backtest.html' -delete
          find . -mindepth 1 -maxdepth 1 -type d ! -name '.git' -exec rm -rf {} +
          cp /tmp/pages/*.html .
          git add -A
          git commit -m "update dashboard" || echo "nothing to commit"
          git push origin gh-pages
